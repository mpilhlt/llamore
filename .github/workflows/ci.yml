name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    release:
        types: [ published ]
    workflow_dispatch:

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt-dev
        
            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  version: "0.6.10"

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install llamore
              run: uv sync --all-extras

            - name: Run tests
              run: uv run pytest tests

    release:
        runs-on: ubuntu-latest
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: tests
        environment: 
            name: pypi
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v7.3

            - name: Build package
              run: uv build

            - name: Smoke test (wheel)
              run: uv run --isolated --no-project -p 3.12 --with dist/*whl -- python -c "import llamore"

            - name: Smoke test (source)
              run: uv run --isolated --no-project -p 3.12 --with dist/*tar.gz -- python -c "import llamore"

            - name: Publish package
              run: uv publish --trusted-publishing always

    deploy-api:
        runs-on: ubuntu-latest
        environment: hf
        needs: tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
          - uses: actions/checkout@v4
    
          - name: Push api/ to HF Space
            env:
              HF_TOKEN: ${{ secrets.HF_TOKEN }}
            run: |
              cd api
              git init -b main
              git config user.email "ci@github"
              git config user.name "CI"
              git remote add hf https://huggingface.co/spaces/Llamore/api
              git add .
              if git diff --cached --quiet; then
                echo "No changes to deploy — skipping push."
                exit 0
              fi
              git commit -m "deploy from ${GITHUB_SHA}"
              git -c http.extraheader="Authorization: Bearer ${HF_TOKEN}" push hf main --force

    rebuild-hf:
        runs-on: ubuntu-latest
        environment: hf
        needs: [tests, deploy-api]
        if: |
          always()
          && (needs.tests.result == 'success'
          || needs.deploy-api.result == 'success'
          || github.event_name == 'workflow_dispatch')
        steps:
          - name: Trigger HF Space rebuild
            env:
              HF_TOKEN: ${{ secrets.HF_TOKEN }}
            run: |
              curl --fail -X POST \
                "https://huggingface.co/api/spaces/Llamore/api/restart?factory=true" \
                -H "Authorization: Bearer ${HF_TOKEN}"
