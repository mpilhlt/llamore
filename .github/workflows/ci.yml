name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    release:
        types: [ published ]
    workflow_dispatch:

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  version: "0.6.10"

            - name: Set up Pyhon
              uses: actions/setup-python@v5
              with:
                  python-version-file: "pyproject.toml"

            - name: Install llamore
              run: uv sync --all-extras

            - name: Run tests
              run: uv run pytest tests

    release:
        runs-on: ubuntu-latest
        if: github.event_name == 'release' && github.event.action == 'published'
        needs: tests
        environment: 
            name: pypi
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  version: "0.6.10"

            - name: Build package
              run: uv build

            - name: Smoke test (wheel)
              run: uv run --isolated --no-project -p 3.10 --with dist/*whl -- python -c "import llamore"

            - name: Smoke test (source)
              run: uv run --isolated --no-project -p 3.10 --with dist/*tar.gz -- python -c "import llamore"

            - name: Publish package
              run: uv publish --trusted-publishing always

    deploy-api:
        runs-on: ubuntu-latest
        if: |
            (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.modified, 'api/'))
            || github.event_name == 'workflow_dispatch'
        needs: tests
        steps:
            - uses: actions/checkout@v4
            - name: Push api to HF Space
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: |
                  cd api
                  git init
                  git config user.email "ci@github"
                  git config user.name "CI"
                  git remote add hf https://user:$HF_TOKEN@hf.co/spaces/Llamore/api
                  git add .
                  git commit -m "deploy from $GITHUB_SHA"
                  git push hf main --force

    rebuild-hf:
        runs-on: ubuntu-latest
        needs: [tests, deploy-api]
        if: |
            needs.tests.result == 'success' &&
            ((github.event_name == 'push' && github.ref == 'refs/heads/main')
            || github.event_name == 'workflow_dispatch')
        steps:
            - name: Trigger HF Space rebuild
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: |
                  curl -X POST \
                    "https://huggingface.co/api/spaces/Llamore/api/restart?factory=true" \
                    -H "Authorization: Bearer $HF_TOKEN"